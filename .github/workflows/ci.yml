name: Forja3D CI & Builds

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux graphics dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev libgtk-3-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
      - name: Run workspace unit & integration tests
        run: xvfb-run cargo test --manifest-path rust-workspace/Cargo.toml --workspace
      - name: Check forja3d on wasm32
        run: cargo check --manifest-path rust-workspace/Cargo.toml -p forja3d --no-default-features --target wasm32-unknown-unknown
      - name: Check forja3d-physics on wasm32
        run: cargo check --manifest-path rust-workspace/Cargo.toml -p forja3d-physics --no-default-features --target wasm32-unknown-unknown
      - name: Check forja3d-studio wasm32 compilation
        run: cargo check --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --lib --target wasm32-unknown-unknown

  Windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: windows-x64
      - name: Build executable
        run: cargo build --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --bin forja3d-studio --release --target x86_64-pc-windows-msvc
      - name: Package release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Copy-Item rust-workspace/target/x86_64-pc-windows-msvc/release/forja3d-studio.exe dist-win/
          Copy-Item rust-workspace/README.md dist-win/
          Compress-Archive -Path dist-win/* -DestinationPath forja3d-studio-windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: forja3d-studio-windows-x86_64.zip

  Linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux graphics dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev libgtk-3-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: linux-x64
      - name: Build binary
        run: cargo build --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --bin forja3d-studio --release --target x86_64-unknown-linux-gnu
      - name: Package tar.gz
        run: |
          mkdir -p dist-linux
          cp rust-workspace/target/x86_64-unknown-linux-gnu/release/forja3d-studio dist-linux/
          strip dist-linux/forja3d-studio || true
          cp rust-workspace/README.md dist-linux/
          tar -C dist-linux -czf forja3d-studio-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: forja3d-studio-linux-x86_64.tar.gz

  MacOS:
    name: MacOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: macos-universal
      - name: Build Apple Silicon & Intel binaries
        run: |
          cargo build --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --bin forja3d-studio --release --target aarch64-apple-darwin
          cargo build --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --bin forja3d-studio --release --target x86_64-apple-darwin
      - name: Create Universal .app bundle and tar.gz
        run: |
          mkdir -p "dist-macos/Forja3D Studio.app/Contents/MacOS"
          lipo -create \
            rust-workspace/target/aarch64-apple-darwin/release/forja3d-studio \
            rust-workspace/target/x86_64-apple-darwin/release/forja3d-studio \
            -output "dist-macos/Forja3D Studio.app/Contents/MacOS/forja3d-studio"
          chmod +x "dist-macos/Forja3D Studio.app/Contents/MacOS/forja3d-studio"
          tar -C dist-macos -czf forja3d-studio-macos-universal.tar.gz "Forja3D Studio.app"
      - uses: actions/upload-artifact@v4
        with:
          name: MacOS
          path: forja3d-studio-macos-universal.tar.gz

  Webassembly:
    name: Webassembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: wasm32
      - name: Install wasm-bindgen CLI (0.2.130)
        run: |
          curl -sSfL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/
          wasm-bindgen --version
      - name: Build WASM cdylib & web package
        run: |
          cargo build --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --lib --target wasm32-unknown-unknown --release
          mkdir -p wasm-dist
          wasm-bindgen --out-dir wasm-dist --target web rust-workspace/target/wasm32-unknown-unknown/release/forja3d_studio.wasm
          tar -C wasm-dist -czf forja3d-studio-wasm-web.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: Webassembly
          path: forja3d-studio-wasm-web.tar.gz


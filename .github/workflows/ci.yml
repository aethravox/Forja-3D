name: CI Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests-and-wasm:
    name: Rust Tests & WebAssembly Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux graphics dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev libgtk-3-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace

      - name: Run workspace unit & integration tests
        run: cargo test --manifest-path rust-workspace/Cargo.toml --workspace

      - name: Check forja3d #![no_std] on wasm32
        run: cargo check --manifest-path rust-workspace/Cargo.toml -p forja3d --no-default-features --target wasm32-unknown-unknown

      - name: Check forja3d-physics #![no_std] on wasm32
        run: cargo check --manifest-path rust-workspace/Cargo.toml -p forja3d-physics --no-default-features --target wasm32-unknown-unknown

      - name: Check forja3d-studio wasm32 compilation
        run: cargo check --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --lib --target wasm32-unknown-unknown

  build-linux:
    name: Build Linux Desktop (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux graphics dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev libgtk-3-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: linux-desktop

      - name: Build release binary
        run: cargo build --manifest-path rust-workspace/crates/forja3d-studio/Cargo.toml --release

  build-macos:
    name: Build macOS Desktop (Universal/Apple Silicon/Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: macos-desktop

      - name: Build release binary
        run: cargo build --manifest-path rust-workspace/crates/forja3d-studio/Cargo.toml --release

  build-windows:
    name: Build Windows Desktop (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: windows-desktop

      - name: Build release binary
        run: cargo build --manifest-path rust-workspace/crates/forja3d-studio/Cargo.toml --release

  build-android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: android-apk

      - name: Install Android SDK & NDK
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK_DIR="${SDK_DIR}/ndk/26.1.10909125"
          TOOLCHAIN_BIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=${TOOLCHAIN_BIN}/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${TOOLCHAIN_BIN}/llvm-ar" >> "$GITHUB_ENV"
          yes | sudo "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          sudo "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build Android APK (Debug)
        run: cargo apk build --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --lib

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forja3D-Studio-Android-APK
          path: |
            rust-workspace/crates/forja3d-studio/target/**/*.apk
            rust-workspace/crates/forja3d-studio/target/android/apk/*.apk
            rust-workspace/crates/forja3d-studio/target/debug/apk/*.apk
          if-no-files-found: warn

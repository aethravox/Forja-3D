name: Multi-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de Release (ej. v0.1.0-alpha.1)"
        required: true
        default: "v0.1.0-alpha.1"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: windows-x64

      - name: Build forja3d-studio.exe
        run: cargo build --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --bin forja3d-studio --release --target x86_64-pc-windows-msvc

      - name: Package Windows release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Copy-Item rust-workspace/target/x86_64-pc-windows-msvc/release/forja3d-studio.exe dist-win/
          Copy-Item rust-workspace/README.md dist-win/
          Compress-Archive -Path dist-win/* -DestinationPath forja3d-studio-windows-x86_64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: forja3d-studio-windows-x86_64.zip

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux graphics dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev libgtk-3-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: linux-x64

      - name: Build forja3d-studio (Linux)
        run: cargo build --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --bin forja3d-studio --release --target x86_64-unknown-linux-gnu

      - name: Package Linux tar.gz
        run: |
          mkdir -p dist-linux
          cp rust-workspace/target/x86_64-unknown-linux-gnu/release/forja3d-studio dist-linux/
          strip dist-linux/forja3d-studio || true
          cp rust-workspace/README.md dist-linux/
          tar -C dist-linux -czf forja3d-studio-linux-x86_64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: forja3d-studio-linux-x86_64.tar.gz

  build-macos:
    name: Build macOS (Universal arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: macos-universal

      - name: Build Apple Silicon & Intel binaries
        run: |
          cargo build --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --bin forja3d-studio --release --target aarch64-apple-darwin
          cargo build --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --bin forja3d-studio --release --target x86_64-apple-darwin

      - name: Create Universal .app bundle and tar.gz
        run: |
          mkdir -p "dist-macos/Forja3D Studio.app/Contents/MacOS"
          lipo -create \
            rust-workspace/target/aarch64-apple-darwin/release/forja3d-studio \
            rust-workspace/target/x86_64-apple-darwin/release/forja3d-studio \
            -output "dist-macos/Forja3D Studio.app/Contents/MacOS/forja3d-studio"
          chmod +x "dist-macos/Forja3D Studio.app/Contents/MacOS/forja3d-studio"
          cat << 'EOF' > "dist-macos/Forja3D Studio.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>forja3d-studio</string>
            <key>CFBundleIdentifier</key>
            <string>dev.aethravox.forja3d</string>
            <key>CFBundleName</key>
            <string>Forja3D Studio</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "dist-macos/Forja3D Studio.app" || true
          tar -C dist-macos -czf forja3d-studio-macos-universal.tar.gz "Forja3D Studio.app"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: forja3d-studio-macos-universal.tar.gz

  build-wasm:
    name: Build WebAssembly + Web Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: wasm32

      - name: Install wasm-bindgen CLI (0.2.130)
        run: |
          curl -sSfL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/
          wasm-bindgen --version

      - name: Build WASM cdylib & standalone web package
        run: |
          cargo build --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --lib --target wasm32-unknown-unknown --release
          mkdir -p wasm-dist
          wasm-bindgen --out-dir wasm-dist --target web rust-workspace/target/wasm32-unknown-unknown/release/forja3d_studio.wasm
          cat << 'EOF' > wasm-dist/index.html
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Forja3D Studio</title>
            <style>
              html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0D11; }
              canvas { width: 100%; height: 100%; display: block; outline: none; }
            </style>
          </head>
          <body>
            <canvas id="forja3d-canvas"></canvas>
            <script type="module">
              import init, { start_forja3d_canvas } from './forja3d_studio.js';
              await init();
              start_forja3d_canvas('forja3d-canvas');
            </script>
          </body>
          </html>
          EOF
          tar -C wasm-dist -czf forja3d-studio-wasm-web.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: release-wasm
          path: forja3d-studio-wasm-web.tar.gz

  build-android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-workspace
          key: android-arm64

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Install Android SDK Build-Tools & NDK
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${SDK_DIR}/ndk/26.1.10909125" >> "$GITHUB_ENV"
          yes | sudo "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          sudo "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Prepare Android signing keystore
        run: |
          mkdir -p "${RUNNER_TEMP}/keystore"
          KEYSTORE="${RUNNER_TEMP}/keystore/release.keystore"
          if [[ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE"
            echo "CARGO_APK_RELEASE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" \
              -storepass forja3d-ci \
              -keypass forja3d-ci \
              -alias forja3d \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Forja3D, OU=Studio, O=Aethravox, L=Dev, S=Dev, C=US"
            echo "CARGO_APK_RELEASE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=forja3d-ci" >> "$GITHUB_ENV"
          fi

      - name: Build & Sign Android APK
        run: |
          cargo apk build --manifest-path rust-workspace/Cargo.toml -p forja3d-studio --lib --release
          APK_PATH=$(find rust-workspace/target -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" forja3d-studio-android-arm64.apk
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner"
          if ! "$APKSIGNER" verify forja3d-studio-android-arm64.apk >/dev/null 2>&1; then
            "$APKSIGNER" sign \
              --ks "$CARGO_APK_RELEASE_KEYSTORE" \
              --ks-pass "pass:${CARGO_APK_RELEASE_KEYSTORE_PASSWORD}" \
              forja3d-studio-android-arm64.apk
          fi
          "$APKSIGNER" verify forja3d-studio-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: forja3d-studio-android-arm64.apk

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos, build-wasm, build-android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with Multi-Platform Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Forja3D Studio ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.apk

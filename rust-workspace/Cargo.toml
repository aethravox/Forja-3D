[workspace]
resolver = "2"
members = [
    "crates/forja3d",
    "crates/forja3d-physics",
    "crates/langes",
    "crates/forja3d-studio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.81"
repository = "https://github.com/aethravox/Forja-3D"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

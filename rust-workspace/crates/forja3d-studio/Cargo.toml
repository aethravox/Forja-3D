[package]
name = "forja3d-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Cross-platform Rust 3D modeling engine & UI (Windows, Linux, Android, WebAssembly) exporting .f3d and .rs."
keywords = ["3d", "modeling", "egui", "wasm", "gamedev"]
categories = ["graphics", "gui", "game-development"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
forja3d = { version = "0.1.0", path = "../forja3d" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "File", "FileList", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlInputElement", "Blob", "BlobPropertyBag", "Url", "Window", "Navigator", "Clipboard"] }
js-sys = "0.3"

[package.metadata.android]
package = "dev.aethravox.forja3d"
apk_name = "forja3d-studio"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "Forja3D Studio"
